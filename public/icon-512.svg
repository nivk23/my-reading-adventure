<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Yellow background -->
  <rect width="512" height="512" rx="112" fill="#F5C518"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="#FFD23F"/>

  <!-- Gold star top-left -->
  <polygon points="72,54 79,78 104,78 84,94 91,118 72,102 53,118 60,94 40,78 65,78" fill="#E8A800"/>

  <!-- Letter A top-right -->
  <text x="390" y="130" font-family="Georgia, serif" font-size="100" font-weight="bold" fill="#B03A00" text-anchor="middle">A</text>

  <!-- Gold star right -->
  <polygon points="426,190 433,214 458,214 438,230 445,254 426,238 407,254 414,230 394,214 419,214" fill="#E8A800"/>

  <!-- Apple shadow -->
  <ellipse cx="252" cy="392" rx="112" ry="20" fill="#D4A000" opacity="0.35"/>

  <!-- Apple body -->
  <path d="M142,218 C142,152 196,128 252,128 C308,128 362,152 362,218 C362,300 322,385 252,385 C182,385 142,300 142,218 Z" fill="#E8302A"/>
  <!-- Apple highlight -->
  <ellipse cx="204" cy="183" rx="26" ry="38" fill="#FF6B5B" opacity="0.55" transform="rotate(-15 204 183)"/>

  <!-- Apple indentation top -->
  <path d="M234,133 C234,118 244,110 252,110 C260,110 270,118 270,133" fill="none" stroke="#C42020" stroke-width="5"/>

  <!-- Stem -->
  <path d="M252,110 C252,110 258,90 276,80" stroke="#7B4B2A" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Leaf -->
  <ellipse cx="292" cy="68" rx="30" ry="18" fill="#4CAF50" transform="rotate(-30 292 68)"/>
  <path d="M278,80 C278,80 290,64 302,58" stroke="#388E3C" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Kawaii eyes -->
  <circle cx="218" cy="236" r="16" fill="#2D1A00"/>
  <circle cx="286" cy="236" r="16" fill="#2D1A00"/>
  <!-- Eye shine -->
  <circle cx="223" cy="229" r="5" fill="white"/>
  <circle cx="291" cy="229" r="5" fill="white"/>

  <!-- Kawaii cheeks -->
  <ellipse cx="192" cy="265" rx="22" ry="13" fill="#FF8C8C" opacity="0.5"/>
  <ellipse cx="312" cy="265" rx="22" ry="13" fill="#FF8C8C" opacity="0.5"/>

  <!-- Kawaii smile -->
  <path d="M218,282 Q252,316 286,282" stroke="#2D1A00" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- ABC Book -->
  <rect x="284" y="318" width="108" height="80" rx="10" fill="#1565C0"/>
  <rect x="284" y="318" width="108" height="80" rx="10" fill="none" stroke="#0D47A1" stroke-width="2"/>
  <!-- Book spine -->
  <rect x="284" y="318" width="10" height="80" rx="5" fill="#0D47A1"/>
  <!-- Book pages top -->
  <path d="M294,312 L386,312 Q392,312 392,318 L294,318 Z" fill="#E3F2FD"/>
  <!-- ABC text -->
  <text x="340" y="367" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle">ABC</text>
</svg>
