<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#FFD23F"/>
  <!-- Apple body -->
  <path d="M14,26 C14,14 23,10 32,10 C41,10 50,14 50,26 C50,40 44,52 32,52 C20,52 14,40 14,26 Z" fill="#E8302A"/>
  <ellipse cx="24" cy="20" rx="5" ry="7" fill="#FF6B5B" opacity="0.55" transform="rotate(-15 24 20)"/>
  <!-- Stem -->
  <path d="M32,10 C32,10 34,5 38,3" stroke="#7B4B2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Leaf -->
  <ellipse cx="40" cy="2" rx="7" ry="4" fill="#4CAF50" transform="rotate(-30 40 2)"/>
  <!-- Eyes -->
  <circle cx="26" cy="29" r="3.5" fill="#2D1A00"/>
  <circle cx="38" cy="29" r="3.5" fill="#2D1A00"/>
  <circle cx="27" cy="28" r="1.2" fill="white"/>
  <circle cx="39" cy="28" r="1.2" fill="white"/>
  <!-- Cheeks -->
  <ellipse cx="21" cy="34" rx="4" ry="2.5" fill="#FF8C8C" opacity="0.5"/>
  <ellipse cx="43" cy="34" rx="4" ry="2.5" fill="#FF8C8C" opacity="0.5"/>
  <!-- Smile -->
  <path d="M26,37 Q32,43 38,37" stroke="#2D1A00" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- ABC book (small) -->
  <rect x="36" y="40" width="16" height="11" rx="2" fill="#1565C0"/>
  <text x="44" y="50" font-family="Arial" font-size="5" font-weight="bold" fill="white" text-anchor="middle">ABC</text>
</svg>
